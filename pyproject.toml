[project]
name = "grokbot"
version = "0.1.0"
description = "Durable, multi-channel agent bot backend: Temporal workflows running LangChain Deep Agents."
requires-python = ">=3.11"
dependencies = [
    "temporalio==1.36.0",
    "temporalio-deepagents==0.0.3",
    "deepagents==0.7.38",
    "langchain-anthropic>=1.7.10",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["grokbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
